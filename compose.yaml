# 本番用。パスワードと設定を docker/.env に書き、--env-file で読み込んで起動する（docker/README.md を参照）。
#
#   docker compose --env-file docker/.env up -d --build

services:
  app:
    build:
      # src/ などを含めるため、コンテキストはリポジトリのルートにする
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app@db:5432/app
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      # docker/.env の値を渡す。書いていなければ空になり、アプリの既定値を使う。
      # env_file で渡さないのは、docker/.env のパスワードまでアプリの環境変数に入ってしまうため
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_CONNECTION_TIMEOUT_SECONDS: ${DB_CONNECTION_TIMEOUT_SECONDS:-}
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:-}
      REQUEST_BODY_TIMEOUT_SECONDS: ${REQUEST_BODY_TIMEOUT_SECONDS:-}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-}
      LOGIN_DEVICE_DAYS: ${LOGIN_DEVICE_DAYS:-}
      LOGIN_IP_MAX_FAILED_ATTEMPTS: ${LOGIN_IP_MAX_FAILED_ATTEMPTS:-}
      LOGIN_IP_WINDOW_MINUTES: ${LOGIN_IP_WINDOW_MINUTES:-}
      LOGIN_IP_LOCKOUT_MINUTES: ${LOGIN_IP_LOCKOUT_MINUTES:-}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-}
      SESSION_ABSOLUTE_TIMEOUT_MINUTES: ${SESSION_ABSOLUTE_TIMEOUT_MINUTES:-}
      PRE_LOGIN_CSRF_TIMEOUT_MINUTES: ${PRE_LOGIN_CSRF_TIMEOUT_MINUTES:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    secrets:
      - db_app_password
    ports:
      # Cookie に Secure を付けているため、HTTPS を受けるリバースプロキシを同じサーバーに置き、そこから転送する。
      # このポートへの接続は、どこからでも APP_NETWORK_GATEWAY から届いたように見える。
      # TRUSTED_PROXIES を書いたまま 127.0.0.1 以外にも公開すると、外から X-Forwarded-For で接続元を偽れる
      - 127.0.0.1:3000:3000
    networks:
      - default
      - db
    # ログ（1 行の JSON）を、同じサーバーの log-forwarder に渡す。送り先は log-forwarder が LOG_DESTINATION で決める
    logging:
      driver: fluentd
      options:
        # Docker がホストから接続する。log-forwarder（ホストのネットワーク）の待ち受けと揃える
        fluentd-address: 127.0.0.1:24224
        tag: sugumi.app
        # log-forwarder の起動を待たずにアプリを起動する。届くまでは Docker がメモリにためて送り直す
        fluentd-async: "true"
    depends_on:
      db:
        condition: service_healthy
      log-forwarder:
        condition: service_started

  # アプリのログを受け取り、送り先（CloudWatch か社内のログ用のサーバー）へ送る。届くまではディスクにためる
  log-forwarder:
    build: ./docker/log-forwarder
    restart: unless-stopped
    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /fluent-bit/etc/sugumi/${LOG_DESTINATION:?docker/.env に LOG_DESTINATION（cloudwatch か internal）を書いてください}.yaml
    environment:
      SERVER_NAME: ${SERVER_NAME:?docker/.env に SERVER_NAME を書いてください}
      LOG_BUFFER_MAX_SIZE: ${LOG_BUFFER_MAX_SIZE:-5G}
      AWS_REGION: ${AWS_REGION:-}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP:-}
      LOG_SERVER_HOST: ${LOG_SERVER_HOST:-}
      LOG_SERVER_PORT: ${LOG_SERVER_PORT:-24224}
      # Fluent Bit は設定の値をファイルから読めないため、secrets ではなく環境変数で渡す
      LOG_SERVER_SHARED_KEY: ${LOG_SERVER_SHARED_KEY:-}
    # ホストのネットワークで動かす。次の 2 つのため（待ち受けは 127.0.0.1 だけ。docker/log-forwarder/pipeline.yaml）
    # - Docker の fluentd ログドライバーはホストから接続する。アプリのコンテナからは届かず、ログを送り込めない
    # - EC2 のメタデータ（IAM ロールの権限）に、ホップ数 1 のまま届く。ブリッジのネットワークにいるアプリのコンテナからは届かない
    network_mode: host
    volumes:
      - log-buffer:/fluent-bit/buffer
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  db:
    build: ./docker/db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: app
      APP_DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_admin_password
      - db_app_password
    volumes:
      # PostgreSQL 18 のイメージは /var/lib/postgresql の下にバージョンごとのディレクトリを作る
      - db-data:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      # 初期化の途中は Unix ソケットだけで待ち受けるため、TCP で確かめて初期化の完了を待つ
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "admin", "-d", "app"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  # 同じサーバーのリバースプロキシから 127.0.0.1:3000 への接続は、アプリにはこのネットワークのゲートウェイから届く。
  # 作り直すたびにアドレスが変わると TRUSTED_PROXIES と合わなくなるため、固定する。
  # サーバーのほかのネットワークと重ならない範囲はサーバーごとに違うため、docker/.env で指定する
  default:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:?docker/.env に APP_NETWORK_SUBNET を書いてください}
          gateway: ${APP_NETWORK_GATEWAY:?docker/.env に APP_NETWORK_GATEWAY を書いてください}
  # DB はこのネットワークだけに置く。internal のため、外部とも通信できない
  db:
    internal: true

volumes:
  db-data:
  log-buffer:

# 環境変数に置くと docker inspect などで見えるため、docker/.env の値からファイルを作り、/run/secrets/ に置く。
# --env-file を付け忘れると、値がないため起動しない
secrets:
  db_admin_password:
    environment: DB_ADMIN_PASSWORD
  db_app_password:
    environment: DB_APP_PASSWORD
