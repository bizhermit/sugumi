# 本番のアプリサーバー。何台でも置ける。パスワードと設定を docker/.env に書き、--env-file で読み込んで起動する（docker/README/setup.md を参照）。
# DB（docker/db/compose.yaml）とロードバランサー（docker/lb/compose.yaml）は、それぞれ 1 つだけ置く。
#
#   docker compose --env-file docker/.env up -d
#
# イメージは、別のサーバーで docker/bake.hcl から作ってレジストリに置いたものを取得する。
# アプリサーバーにはソースを置かないので、ここではビルドしない

# ボリュームなどの名前の頭に付く。置いたディレクトリの名前で決まらないよう、固定する
name: myapp

services:
  app:
    image: ${IMAGE_PREFIX:?docker/.env に IMAGE_PREFIX を書いてください}/app:${IMAGE_TAG:?docker/.env に IMAGE_TAG を書いてください}
    restart: unless-stopped
    environment:
      # DB サーバーへは TLS で接続し、DB の証明書が DB_HOST のものか、DB の CA で確かめる
      DATABASE_URL: postgres://app@${DB_HOST:?docker/.env に DB_HOST を書いてください}:5432/app?sslmode=verify-full&sslrootcert=/run/secrets/db_ca_cert
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      # docker/.env の値を渡す。書いていなければ空になり、アプリのデフォルト値が使われる。
      # env_file で渡さないのは、docker/.env のパスワードまでアプリの環境変数に入ってしまうため
      APP_MODE: ${APP_MODE:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REQUEST_BODY_TIMEOUT_SECONDS: ${REQUEST_BODY_TIMEOUT_SECONDS:-}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-}
      SESSION_ABSOLUTE_TIMEOUT_MINUTES: ${SESSION_ABSOLUTE_TIMEOUT_MINUTES:-}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-}
      LOGIN_DEVICE_DAYS: ${LOGIN_DEVICE_DAYS:-}
      LOGIN_IP_MAX_FAILED_ATTEMPTS: ${LOGIN_IP_MAX_FAILED_ATTEMPTS:-}
      LOGIN_IP_WINDOW_MINUTES: ${LOGIN_IP_WINDOW_MINUTES:-}
      LOGIN_IP_LOCKOUT_MINUTES: ${LOGIN_IP_LOCKOUT_MINUTES:-}
      PRE_LOGIN_CSRF_TIMEOUT_MINUTES: ${PRE_LOGIN_CSRF_TIMEOUT_MINUTES:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_CONNECTION_TIMEOUT_SECONDS: ${DB_CONNECTION_TIMEOUT_SECONDS:-}
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:-}
    secrets:
      - db_app_password
      - db_ca_cert
    ports:
      # ロードバランサーから届くアドレスで待ち受ける。ロードバランサー以外からの接続は、ファイアウォールで止める。
      # ロードバランサーが同じサーバーにあるなら 127.0.0.1 にする。127.0.0.1 への接続は、APP_NETWORK_GATEWAY から届いたように見える。
      # TRUSTED_PROXIES を書いたまま、ロードバランサー以外からも届くようにすると、X-Forwarded-For で接続元を偽れる
      # （docker/README/load-balancer.md の「接続元を偽装される条件」）
      - ${APP_LISTEN_ADDRESS:-127.0.0.1}:3000:3000
    # ログ（1 行の JSON）を、同じサーバーの log-forwarder に渡す。送り先は log-forwarder が LOG_DESTINATION で決める
    logging:
      driver: fluentd
      options:
        # Docker がホストから接続する。log-forwarder（ホストのネットワーク）の待ち受けと揃える
        fluentd-address: 127.0.0.1:24224
        tag: app
        # log-forwarder の起動を待たずにアプリを起動する。届くまでは Docker がメモリにためて送り直す
        fluentd-async: "true"
    # DB は別のサーバーにあるので、起動の順番は待てない。DB に接続できないうちは、起動に失敗して起動し直す
    depends_on:
      log-forwarder:
        condition: service_started

  # アプリのログを受け取り、送り先（CloudWatch かログ用サーバー）へ送る。届くまではディスクにためる
  log-forwarder:
    image: ${IMAGE_PREFIX:?docker/.env に IMAGE_PREFIX を書いてください}/log-forwarder:${IMAGE_TAG:?docker/.env に IMAGE_TAG を書いてください}
    restart: unless-stopped
    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /fluent-bit/etc/custom/${LOG_DESTINATION:?docker/.env に LOG_DESTINATION（cloudwatch か internal）を書いてください}.yaml
    environment:
      SERVER_NAME: ${SERVER_NAME:?docker/.env に SERVER_NAME を書いてください}
      LOG_BUFFER_MAX_SIZE: ${LOG_BUFFER_MAX_SIZE:-5G}
      AWS_REGION: ${AWS_REGION:-}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP:-}
      LOG_SERVER_HOST: ${LOG_SERVER_HOST:-}
      LOG_SERVER_PORT: ${LOG_SERVER_PORT:-24224}
      # Fluent Bit は設定の値をファイルから読めないので、secrets ではなく環境変数で渡す
      LOG_SERVER_SHARED_KEY: ${LOG_SERVER_SHARED_KEY:-}
    # 理由は次の 2 つで、ホストのネットワークで動かす（待ち受けは 127.0.0.1 だけ。docker/log-forwarder/pipeline.yaml）
    # - Docker の fluentd ログドライバーはホストから接続する。アプリのコンテナからは届かないので、ログを送り込めない
    # - EC2 のメタデータ（IAM ロールの権限）に、ホップ数 1 のまま届く。ブリッジのネットワークにいるアプリのコンテナからは届かない
    network_mode: host
    volumes:
      - log-buffer:/fluent-bit/buffer
      # internal で、ログ用サーバーの証明書を確かめる CA の証明書（log-server-ca.crt）。cloudwatch では空でよい。
      # サーバーごとに違うので、イメージには入れず、アプリサーバーに置いたものを読む
      - ./docker/log-forwarder/certs:/fluent-bit/etc/custom/certs:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  # 同じサーバーのロードバランサーから 127.0.0.1:3000 への接続は、アプリにはこのネットワークのゲートウェイから届く。
  # 作り直すたびにアドレスが変わると TRUSTED_PROXIES と合わなくなるので、固定する。
  # サーバーのほかのネットワークと重ならない範囲はサーバーごとに違うので、docker/.env で指定する
  default:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:?docker/.env に APP_NETWORK_SUBNET を書いてください}
          gateway: ${APP_NETWORK_GATEWAY:?docker/.env に APP_NETWORK_GATEWAY を書いてください}

volumes:
  log-buffer:

# 環境変数に置くと docker inspect などで見えてしまうので、docker/.env の値からファイルを作り、/run/secrets/ に置く。
# --env-file を付け忘れると、値がないので起動しない
secrets:
  db_app_password:
    environment: DB_APP_PASSWORD
  # DB サーバーの証明書を確かめる CA の証明書。サーバーごとに置く（docker/README/db-server.md）
  db_ca_cert:
    file: ./docker/certs/db-ca.crt
