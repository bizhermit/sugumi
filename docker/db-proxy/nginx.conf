# DB の転送役の設定。受けた TCP の接続を、中身を解釈せずに DB のコンテナへ流す。
# TLS も DB まで素通しにするので、証明書は DB が持つ（docker/db/compose.yaml）。

user nginx;
worker_processes 1;
pid /run/nginx.pid;
# イメージは /var/log/nginx/error.log を標準エラーにつないでいる
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

stream {
    # DB のコンテナを作り直すとアドレスが変わるので、起動時に 1 回だけでなく、Docker の DNS で引き直す。
    # 引くのは同じ compose の名前（db）だけなので、Docker の DNS は外へ問い合わせない
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream db {
        zone db 64k;
        server db:5432 resolve;
    }

    server {
        listen 5432;
        proxy_pass db;
        proxy_connect_timeout 5s;
    }
}
