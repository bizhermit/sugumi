service:
  # ファイルに書けない間（ディスクの不調など）も、受け取ったログを捨てずにためる
  storage.path: /fluent-bit/buffer
  storage.sync: full
  log_level: info

pipeline:
  inputs:
    # アプリのサーバーの log-forwarder（docker/log-forwarder/internal.yaml）から受け取る
    - name: forward
      listen: 0.0.0.0
      port: 24224
      tls: on
      # 送り手は証明書ではなく、共有の鍵で確かめる
      tls.verify: off
      tls.crt_file: /fluent-bit/etc/sugumi/certs/server.crt
      tls.key_file: /fluent-bit/etc/sugumi/certs/server.key
      shared_key: ${LOG_SERVER_SHARED_KEY}
      self_hostname: ${LOG_SERVER_NAME}
      storage.type: filesystem

  filters:
    # 監査ログは保存日数を分けるため、別のファイルに書く
    - name: rewrite_tag
      match: sugumi.app
      rule: $type ^audit$ sugumi.audit false
      emitter_storage.type: filesystem

  outputs:
    # ファイル名から送り手の値を使わない。送り手が乗っ取られても、/logs の外に書かせないため
    - name: file
      match: sugumi.app
      path: /logs
      file: app-%Y-%m-%d.jsonl
      enable_strftime: on
      # 日付ごとのファイルは、日数がたつほど増えるため、数で打ち切らない
      max_dynamic_files: 0
      on_missing_field: fallback
      fallback_path: /logs
      fallback_file: app-fallback.jsonl
      format: plain
      rotate: on
      rotate_max_size: ${LOG_FILE_MAX_SIZE}
      # 1 日のうちに上限まで分かれても消さない。消すのは log-cleaner が日数で行う
      rotate_max_files: 10000
      retry_limit: no_limits
    - name: file
      match: sugumi.audit
      path: /logs
      file: audit-%Y-%m-%d.jsonl
      enable_strftime: on
      # 日付ごとのファイルは、日数がたつほど増えるため、数で打ち切らない
      max_dynamic_files: 0
      on_missing_field: fallback
      fallback_path: /logs
      fallback_file: audit-fallback.jsonl
      format: plain
      rotate: on
      rotate_max_size: ${LOG_FILE_MAX_SIZE}
      rotate_max_files: 10000
      retry_limit: no_limits
