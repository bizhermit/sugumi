# ロードバランサーの設定。満たすことと値の決め方は docker/README/load-balancer.md を参照。
# サーバーごとに違うもの（振り分け先・証明書）は、ロードバランサーに置いたファイルを読む（docker/lb/compose.yaml）。

user nginx;
worker_processes auto;
pid /run/nginx.pid;
# イメージは /var/log/nginx/error.log を標準エラーにつないでいる。
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    # アクセスログはアプリが出す。
    access_log off;

    # 遅い接続を打ち切る。
    client_header_timeout 10s;
    client_body_timeout 10s;   # リクエストボディを読み込む間隔。全体の時間ではない。
    client_max_body_size 1m;   # アプリのリクエストボディの上限（src/web/app.ts の MAX_BODY_BYTES）と揃える。
    send_timeout 10s;
    # アプリの DB_CONNECTION_TIMEOUT_SECONDS と DB_STATEMENT_TIMEOUT_SECONDS の合計より十分に長くする。
    proxy_read_timeout 60s;

    # 接続元ごとの同時接続数とリクエストの頻度。
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
    # POST /login だけを数える。アプリは、接続元の制限中もパスワードの検証と同じだけ CPU を使うため。
    # $uri はデコード・正規化した値なので、/%6cogin なども /login として数える。
    map "$request_method $uri" $login_key {
        "POST /login" $binary_remote_addr;
        default       "";
    }
    # NAT の裏のユーザーが始業時にまとめてログインしても通るよう、burst に余裕を持たせる。
    limit_req_zone $login_key zone=login_per_ip:10m rate=30r/m;
    limit_conn_status 429;
    limit_req_status 429;

    upstream app {
        # 振り分け先のアプリサーバー（ロードバランサーの upstream/servers.conf）。
        include /etc/nginx/upstream/*.conf;
        # アプリへの接続を使い回す。リクエストのたびに TCP の接続を張ると遅くなり、TIME_WAIT のソケットが溜まる。
        # （ワーカーごとに、空いた接続を残しておく数）。
        # 空いた接続は、こちらの keepalive_timeout（デフォルトの 60 秒）で閉じる。アプリ（Deno.serve）は空いた接続を閉じないため。
        # アプリが先に閉じると、閉じた瞬間に送った POST は送り直されずに 502 になる。アプリ側で閉じるようにしたら、それより短くする。
        keepalive 32;
    }

    server {
        # IPv4 だけで待ち受ける。[::] を書くと、IPv6 を無効にしたホストで起動しない。
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        limit_conn conn_per_ip 20;

        # location は 1 つにする。proxy_set_header と limit_req は、location に 1 つでも書くと外側の分を引き継がないので、
        # location を分けると同じ設定を並べることになり、片方だけ直したときに食い違う。
        # X-Forwarded-For は接続元だけで上書きする。ユーザーが送った値を転送すると、どの IP アドレスでも名乗れてしまう。
        location / {
            proxy_pass http://app;
            proxy_set_header X-Forwarded-For $remote_addr;
            # upstream の keepalive に要る。HTTP/1.0 と Connection: close のままだと、接続を使い回せない。
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            limit_req zone=req_per_ip burst=100 nodelay;
            # $login_key が空のリクエスト（POST /login 以外）は数えない。
            limit_req zone=login_per_ip burst=30 nodelay;
        }
    }
}
