# ロードバランサー。HTTPS を受け、アプリサーバー（リポジトリ直下の compose.yaml）へ振り分ける。
# ファイルを用意してから（docker/README/load-balancer.md を参照）、このディレクトリで起動する。
#
#   docker compose --env-file .env up -d

# ボリュームなどの名前の頭に付く。置いたディレクトリの名前で決まらないよう、固定する。
name: myapp-lb

services:
  lb:
    image: ${IMAGE_PREFIX:?.env に IMAGE_PREFIX を書いてください}/lb:${IMAGE_TAG:?.env に IMAGE_TAG を書いてください}
    restart: unless-stopped
    # ユーザーの本当の接続元を見るため、ホストのネットワークで動かす。
    # ポートを公開する形では、環境によって（IPv6 の接続など）接続元が Docker のゲートウェイのアドレスになり、全員が同じ接続元に見える。
    network_mode: host
    volumes:
      # ファイルではなくディレクトリをマウントする。ファイルだけだと、作り直して保存するエディターで書き換えたときに、古いファイルを読み続ける。
      - ./upstream:/etc/nginx/upstream:ro
      - ./certs:/etc/nginx/certs:ro
