# 本番の DB サーバーと CI で使う（docker/db/compose.yaml の hba_file）。開発は、イメージのデフォルトを使う。
#
# コンテナの中（db-migrate・db-backup）からは、Unix ソケットでパスワードなしで接続できる。
# TCP の loopback は信用しない。コンテナの実行環境によっては、外からの接続が 127.0.0.1 から届いたように見えるため。
# ヘルスチェックの pg_isready は、認証に失敗しても接続を受け付けたと判定するので、reject でよい。
local   all  all                 trust
# db-backup（pg_basebackup）は、レプリケーションの接続で読む。all には含まれないので、別に書く。
local   replication  admin       trust
host    all  all  127.0.0.1/32   reject
host    all  all  ::1/128        reject
# コンテナの外からは、ユーザー app（アプリ）だけが、TLS で、アプリの DB にだけ接続できる。
# CONNECT の権限（docker/db/init/10-app-role.sh）でも絞っているが、ここでも DB を絞る。
# 管理者が後から作った DB には、誰でも接続できる権限が標準で付くため。
# DB のコンテナは internal のネットワークにいて、届くのは db-proxy が流したアプリサーバーからの接続だけ。接続元は db-proxy のアドレスになるので、範囲では絞らない。
# migrator（マイグレーション）と管理者（admin）は、コンテナの外から接続できない。管理の作業は docker compose exec で行う。
hostssl app  app  all  scram-sha-256
