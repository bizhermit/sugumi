# 本番の DB サーバーで使う（docker/db/compose.yaml の hba_file）。開発と CI は、イメージのデフォルトを使う。
#
# コンテナの中（db-backup・db-restore・ヘルスチェック）からは、パスワードなしで接続できる。
local   all  all                 trust
host    all  all  127.0.0.1/32   trust
host    all  all  ::1/128        trust
# コンテナの外からは、ユーザー app（アプリ）と migrator（マイグレーション）だけが、TLS で、アプリの DB にだけ接続できる。
# 管理者（admin）はコンテナの外から接続できない。管理の作業は docker compose exec で行う。
hostssl app  app,migrator  all  scram-sha-256
