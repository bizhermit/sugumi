name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/app_test
      TEST_MIGRATION_DATABASE_URL: postgres://migrator:migrator@127.0.0.1:5432/app_test
      # e2e/deno.json の permissions で、このパスのブラウザだけを読み込み・起動できるようにしている
      PLAYWRIGHT_BROWSERS_PATH: /usr/local/share/ms-playwright
      # docker/bake.hcl で作るイメージの名前（ci/app:ci など）。CI ではレジストリに push しない
      IMAGE_PREFIX: ci
      IMAGE_TAG: ci
    steps:
      # 更新時は `gh api repos/<owner>/<repo>/commits/<タグ> --jq .sha` でコミットを取得して置き換える
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # docker/app/Dockerfile のイメージ・.devcontainer/Dockerfile の DENO_VERSION と揃える
          deno-version: 2.9.7

      # 権限を本番と揃えるため、本番と同じイメージ（docker/db/）を使う。
      # サービスコンテナはリポジトリの Dockerfile からビルドできないので、ここで起動し、初期化はテストの前に待つ
      - name: テスト用の DB を起動する
        run: |
          docker buildx bake -f docker/bake.hcl --load db
          docker run -d --name db -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=admin -e POSTGRES_PASSWORD=admin -e POSTGRES_DB=app_test \
            -e APP_DB_PASSWORD=app -e MIGRATOR_DB_PASSWORD=migrator \
            ci/db:ci

      - run: deno fmt --check
      - run: deno lint
      - run: deno check
      - name: e2e/ を確かめる
        # ルートの deno.json は e2e/ を除外しているので、e2e/ の deno.json で別に確かめる
        working-directory: e2e
        run: |
          deno fmt --check
          deno lint
          deno check
      - name: routes.gen.ts が src/routes/ と食い違っていないか確かめる
        run: |
          deno task gen
          git diff --exit-code src/routes.gen.ts
      - run: deno task build
      - name: 本番のイメージをビルドする
        run: docker buildx bake -f docker/bake.hcl --load app
      # CI には送り先がないので、実際に送れるかまでは確かめられない。設定ファイルを読み込めることだけを確かめる
      - name: log-forwarder のイメージをビルドし、設定を確かめる
        run: |
          docker buildx bake -f docker/bake.hcl --load log-forwarder
          for destination in cloudwatch internal; do
            docker run --rm -e SERVER_NAME=ci -e LOG_BUFFER_MAX_SIZE=1G ci/log-forwarder:ci \
              /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/custom/$destination.yaml --dry-run
          done
      # 振り分け先と証明書はロードバランサーに置くものなので、仮のものを作って設定を読み込めることを確かめる
      - name: lb のイメージをビルドし、設定を確かめる
        run: |
          docker buildx bake -f docker/bake.hcl --load lb
          install -d "$RUNNER_TEMP/lb/upstream" "$RUNNER_TEMP/lb/certs"
          cp docker/lb/servers.conf.example "$RUNNER_TEMP/lb/upstream/servers.conf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout "$RUNNER_TEMP/lb/certs/privkey.pem" -out "$RUNNER_TEMP/lb/certs/fullchain.pem"
          docker run --rm \
            -v "$RUNNER_TEMP/lb/upstream:/etc/nginx/upstream:ro" -v "$RUNNER_TEMP/lb/certs:/etc/nginx/certs:ro" \
            ci/lb:ci nginx -t

      - name: DB の初期化を待つ
        # 初期化の途中は Unix ソケットだけで待ち受けるので、TCP で確かめる
        run: timeout 60 sh -c 'until docker exec db pg_isready -h 127.0.0.1 -U admin -d app_test; do sleep 1; done'
      - run: deno task test

      - name: ブラウザを入れる
        # Playwright は自身のバージョンに合うブラウザしか起動しないので、e2e/deno.json の imports と同じものから入れる。
        # e2e/ で実行し、ルートの deno.lock に Playwright を書き込ませない。
        # --with-deps は付けない。ランナーには Chrome が入っていて、起動に要るライブラリはそろっている。
        # --with-deps が足すのはスクリーンショット用のフォントで、apt のミラーが遅いとジョブの時間を使い切るため
        working-directory: e2e
        timeout-minutes: 5
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
          deno run -A --frozen "$(jq -r '.imports.playwright' deno.json)" install --only-shell chromium
      - name: 本番のイメージを起動する
        # e2e/ のテストを、デプロイするものと同じイメージに対して実行する（手元の deno task test:e2e は deno run で起動する）。
        # DB のパスワードは、本番の compose.yaml の secrets と同じく /run/secrets/ のファイルで渡す。
        # ホストのネットワークで動かし、テスト用の DB にもブラウザからも 127.0.0.1 で接続する。
        # __Host- の Cookie は、ブラウザが安全なオリジンとして扱う 127.0.0.1 でなければ HTTP で保存されない
        run: |
          install -d -m 755 "$RUNNER_TEMP/secrets"
          printf '%s' app > "$RUNNER_TEMP/secrets/db_app_password"
          printf '%s' migrator > "$RUNNER_TEMP/secrets/db_migrator_password"
          chmod 644 "$RUNNER_TEMP/secrets/db_app_password" "$RUNNER_TEMP/secrets/db_migrator_password"
          # 本番の compose.yaml の migrate と同じく、イメージの src/migrate.ts を migrator で実行する。
          # deno task test で適用済みなので、イメージの中で実行できることを確かめる
          docker run --rm --network host \
            -e DATABASE_URL=postgres://migrator@127.0.0.1:5432/app_test \
            -e DATABASE_PASSWORD_FILE=/run/secrets/db_migrator_password \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            ci/app:ci run --cached-only -P src/migrate.ts
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://app@127.0.0.1:5432/app_test \
            -e DATABASE_PASSWORD_FILE=/run/secrets/db_app_password \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            ci/app:ci
      - name: 本番のイメージに対して e2e/ のテストを実行する
        run: deno task test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - name: アプリのログを出す
        if: failure()
        run: docker logs app
