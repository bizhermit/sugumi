name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 本番のアプリと同じく、db-proxy を通して TLS で接続し、DB の証明書を CA で確かめる。
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=verify-full&sslrootcert=docker/certs/db-ca.crt
      # e2e/deno.json の permissions で、このパスのブラウザだけを読み込み・起動できるようにしている。
      PLAYWRIGHT_BROWSERS_PATH: /usr/local/share/ms-playwright
      # docker/bake.hcl で作るイメージの名前（ci/app:ci など）。CI ではレジストリに push しない。
      IMAGE_PREFIX: ci
      IMAGE_TAG: ci
      # docker/db/compose.yaml の値（本番では DB サーバーの .env に書く）。
      # 本番と違って 127.0.0.1 で待ち受けるのは、アプリのコンテナもホストのネットワークで動かすため。
      DB_ADMIN_PASSWORD: admin
      DB_APP_PASSWORD: app
      DB_LISTEN_ADDRESS: 127.0.0.1
    steps:
      # 更新時は `gh api repos/<owner>/<repo>/commits/<タグ> --jq .sha` でコミットを取得して置き換える。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # docker/app/Dockerfile のイメージ・.devcontainer/Dockerfile の DENO_VERSION と揃える。
          deno-version: 2.9.7

      # 本番と同じイメージ・docker/db/compose.yaml（pg_hba.conf・TLS・db-proxy）で起動する（docker/README/db-server.md の手順）。
      # サービスコンテナはリポジトリの Dockerfile からビルドできないので、ここで起動する。
      - name: テスト用の DB を起動する
        run: |
          docker buildx bake -f docker/bake.hcl --load db db-proxy
          # 証明書は docker/README/db-server.md の「証明書の作成方法」と同じく作る。接続先は IP アドレスにする。
          ca="$RUNNER_TEMP/db-ca"
          install -d -m 700 "$ca"
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -subj /CN=ci-db-ca -keyout "$ca/ca.key" -out "$ca/ca.crt"
          openssl req -newkey rsa:3072 -nodes -subj /CN=127.0.0.1 -keyout "$ca/server.key" -out "$ca/server.csr"
          openssl x509 -req -days 1 -in "$ca/server.csr" -CA "$ca/ca.crt" -CAkey "$ca/ca.key" -CAcreateserial \
            -extfile <(printf "subjectAltName=IP:127.0.0.1") -out "$ca/server.crt"
          # DB サーバーの certs/ と、アプリサーバーの docker/certs/ に置くのと同じ（db-server.md・setup.md）。
          install -d docker/db/certs docker/certs
          install -m 644 "$ca/server.crt" docker/db/certs/server.crt
          sudo install -o root -g 70 -m 640 "$ca/server.key" docker/db/certs/server.key
          install -m 644 "$ca/ca.crt" docker/certs/db-ca.crt
          docker compose -f docker/db/compose.yaml up -d --wait
          # テストが空にできるよう、使い捨ての印を付ける（tests/_support/db.ts の resetDb()）。
          # 本番の管理作業と同じく、DB のコンテナの中から管理者で実行する。
          docker compose -f docker/db/compose.yaml exec -T db psql -U admin -d app -c "COMMENT ON DATABASE app IS 'disposable'"

      - run: deno fmt --check
      - run: deno lint
      - run: deno check
      - name: e2e/ を確かめる
        # ルートの deno.json は e2e/ を除外しているので、e2e/ の deno.json で別に確かめる。
        working-directory: e2e
        run: |
          deno fmt --check
          deno lint
          deno check
      - name: 生成するファイルが、元のファイルと食い違っていないか確かめる
        run: |
          deno task gen
          git diff --exit-code src/routes.gen.ts src/lib/schema-version.gen.ts
      - run: deno task build
      - name: 本番のイメージをビルドする
        run: docker buildx bake -f docker/bake.hcl --load app
      # CI には送り先がないので、実際に送れるかまでは確かめられない。設定ファイルを読み込めることだけを確かめる。
      - name: log-forwarder のイメージをビルドし、設定を確かめる
        run: |
          docker buildx bake -f docker/bake.hcl --load log-forwarder
          for destination in cloudwatch internal; do
            docker run --rm -e SERVER_NAME=ci -e LOG_BUFFER_MAX_SIZE=1G ci/log-forwarder:ci \
              /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/custom/$destination.yaml --dry-run
          done
      # 振り分け先と証明書はロードバランサーに置くものなので、仮のものを作って設定を読み込めることを確かめる。
      - name: lb のイメージをビルドし、設定を確かめる
        run: |
          docker buildx bake -f docker/bake.hcl --load lb
          install -d "$RUNNER_TEMP/lb/upstream" "$RUNNER_TEMP/lb/certs"
          cp docker/lb/servers.conf.example "$RUNNER_TEMP/lb/upstream/servers.conf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout "$RUNNER_TEMP/lb/certs/privkey.pem" -out "$RUNNER_TEMP/lb/certs/fullchain.pem"
          docker run --rm \
            -v "$RUNNER_TEMP/lb/upstream:/etc/nginx/upstream:ro" -v "$RUNNER_TEMP/lb/certs:/etc/nginx/certs:ro" \
            ci/lb:ci nginx -t

      - name: 本番と同じく、DB のコンテナの中からマイグレーションを適用する
        run: docker compose -f docker/db/compose.yaml exec -T db db-migrate
      - run: deno task test

      - name: ブラウザを入れる
        # Playwright は自身のバージョンに合うブラウザしか起動しないので、e2e/deno.json の imports と同じものから入れる。
        # e2e/ で実行し、ルートの deno.lock に Playwright を書き込ませない。
        # --with-deps は付けない。ランナーには Chrome が入っていて、起動に要るライブラリはそろっている。
        # --with-deps が足すのはスクリーンショット用のフォントで、apt のミラーが遅いとジョブの時間を使い切るため。
        working-directory: e2e
        timeout-minutes: 5
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
          deno run -A --frozen "$(jq -r '.imports.playwright' deno.json)" install --only-shell chromium
      - name: 本番のイメージを起動する
        # e2e/ のテストを、デプロイするものと同じイメージに対して実行する（手元の deno task test:e2e は deno run で起動する）。
        # DB のパスワードと CA 証明書は、本番の compose.yaml の secrets と同じく /run/secrets/ のファイルで渡す。
        # ホストのネットワークで動かし、テスト用の DB（db-proxy）にもブラウザからも 127.0.0.1 で接続する。
        # __Host- の Cookie は、ブラウザが安全なオリジンとして扱う 127.0.0.1 でなければ HTTP で保存されない。
        run: |
          install -d -m 755 "$RUNNER_TEMP/secrets"
          printf '%s' app > "$RUNNER_TEMP/secrets/db_app_password"
          chmod 644 "$RUNNER_TEMP/secrets/db_app_password"
          install -m 644 docker/certs/db-ca.crt "$RUNNER_TEMP/secrets/db_ca_cert"
          docker run -d --name app --network host \
            -e 'DATABASE_URL=postgres://app@127.0.0.1:5432/app?sslmode=verify-full&sslrootcert=/run/secrets/db_ca_cert' \
            -e DATABASE_PASSWORD_FILE=/run/secrets/db_app_password \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            ci/app:ci
      - name: 本番のイメージに対して e2e/ のテストを実行する
        run: deno task test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - name: アプリと DB のログを出す
        if: failure()
        run: |
          docker logs app || true
          docker compose -f docker/db/compose.yaml logs
