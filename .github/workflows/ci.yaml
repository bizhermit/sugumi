name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # テスト用DB。.devcontainer/compose.yamlのdb-testと同じロールとパスワード。
      APP_TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/app
      APP_TEST_MIGRATION_DATABASE_URL: postgres://migrator:migrator@127.0.0.1:5432/app
    steps:
      # actionsはタグではなくコミットで固定する。
      # 更新時はコミットを取得して置き換える。
      # > gh api repos/<owner>/<repo>/git/ref/tags/<タグ> --jq .object.sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # .devcontainer/Dockerfile の NODE_VERSION、deploy/app/Dockerfile のイメージと揃える。
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - name: テスト用DBを本番と同じイメージで起動する
        run: |
          docker build -t myapp/db:ci deploy/db
          docker run -d --name db-test -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=admin -e POSTGRES_PASSWORD=admin -e POSTGRES_DB=app \
            -e DB_APP_PASSWORD=app -e DB_MIGRATOR_PASSWORD=migrator \
            myapp/db:ci
          # 初期化中は一時サーバーがソケットだけで応答するので、TCPで確かめる。
          for i in $(seq 1 30); do
            if docker exec db-test pg_isready -h 127.0.0.1 -U admin -d app; then
              exit 0
            fi
            sleep 1
          done
          echo "テスト用DBが起動しませんでした。" >&2
          docker logs db-test >&2
          exit 1
      - run: npm run check
      - run: npm run lint -- --deny-warnings
      - run: npm run format:check
      - run: npm test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: ci
      # deploy/server/compose.yamlが要求する値。CIの中だけで使う。
      DB_ADMIN_PASSWORD: ci
      DB_APP_PASSWORD: ci
      DB_MIGRATOR_PASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 本番と同じイメージをビルドする
        run: docker compose -f deploy/server/compose.yaml build
      - name: コンテナを起動し、ロードバランサー経由でヘルスチェックに応答することを確認する
        run: |
          docker compose -f deploy/server/compose.yaml up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "ヘルスチェックに応答しませんでした。" >&2
          exit 1
      - name: ログを出力する
        if: failure()
        run: docker compose -f deploy/server/compose.yaml logs
      - name: コンテナを停止および削除する
        if: always()
        run: docker compose -f deploy/server/compose.yaml down
