services:
  dev:
    env_file:
      - path: .env
        required: true
    environment:
      # デフォルトは開発用の DB。db サービスには compose のネットワークの中からだけ接続できる。
      # .env に書くと、その値で上書きできる（environment は env_file より優先されるので、ここで受け取る）。
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      # deno task test が使う DB。テストはテーブルを空にするので、開発用の DB とは分ける。
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://app:app@db-test:5432/app}
      # マイグレーション（deno task migrate）の接続先。スキーマを持つ migrator で接続する。
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://migrator:migrator@db:5432/app}
      TEST_MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL:-postgres://migrator:migrator@db-test:5432/app}
    build:
      # e2e/deno.json・deno.lock を読むため、コンテキストはリポジトリの直下にする。
      # 含めるものは Dockerfile.dockerignore で絞る。
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: root
    # e2e/ のテストが起動する Chrome の子プロセスは、親が終わると PID 1 の子になる。
    # command の sleep は終わった子プロセスを回収しないので、init を PID 1 に置いて回収させる。
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspace:cached
      - claude-config:/home/dev/.claude
      - gh-config:/home/dev/.config/gh
    depends_on:
      - db
      - db-test
    command: sleep infinity

  # 開発用の PostgreSQL。権限を本番と揃えるため、本番と同じイメージ（docker/db/）を使う。ポートはホストに公開しない。
  db:
    build: ../docker/db
    environment:
      # 開発用の DB には compose のネットワークの中からだけ接続できるので、パスワードは固定の値にしている。
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
      APP_DB_PASSWORD: app
      MIGRATOR_DB_PASSWORD: migrator
    volumes:
      # Rebuild しても残す。PostgreSQL 18 のイメージは /var/lib/postgresql の下にバージョンごとのディレクトリを作る。
      - db-data:/var/lib/postgresql

  # テスト用の PostgreSQL。db と同じイメージ・設定で、データは残さない。
  # DB の名前は本番と同じ app にし、使い捨ての印を付ける。テストは、印のない DB を空にしない（tests/_support/db.ts）。
  db-test:
    build: ../docker/db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
      APP_DB_PASSWORD: app
      MIGRATOR_DB_PASSWORD: migrator
    volumes:
      # イメージの初期化（docker/db/init/）のあとに実行されるよう、名前を後ろの番号にする。
      - ./db-test/disposable.sql:/docker-entrypoint-initdb.d/90-disposable.sql:ro
    tmpfs:
      - /var/lib/postgresql

volumes:
  claude-config:
  gh-config:
  db-data:
