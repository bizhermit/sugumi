services:
  dev:
    env_file:
      - path: .env
        required: true
    environment:
      # 既定は開発用の DB。db サービスは compose のネットワークの中からだけ接続できる
      # .env に書くと、その値で上書きできる（environment は env_file より優先されるため、ここで受け取る）
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/app}
      # deno task test が使う DB。テストはテーブルを空にするため、開発用の DB とは分ける
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://app:app@db-test:5432/app_test}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: root
    # e2e/ のテストが起動する Chrome の子プロセスは、親が終わると PID 1 の子になる。
    # command の sleep は終わった子プロセスを回収しないため、init を PID 1 に置いて回収させる
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspace:cached
      - claude-config:/home/dev/.claude
      - gh-config:/home/dev/.config/gh
    depends_on:
      - db
      - db-test
    command: sleep infinity

  # 開発用の PostgreSQL。権限を本番と揃えるため、本番と同じイメージ（docker/db/）を使う。ポートはホストに公開しない
  db:
    build: ../docker/db
    environment:
      # 開発用の DB は compose のネットワークの中からだけ接続できるため、パスワードは固定の値にしている
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
      APP_DB_PASSWORD: app
    volumes:
      # Rebuild しても残す。PostgreSQL 18 のイメージは /var/lib/postgresql の下にバージョンごとのディレクトリを作る
      - db-data:/var/lib/postgresql

  # テスト用の PostgreSQL。db と同じイメージ・設定で、データは残さない。
  # DB 名は _test で終わらせる。テストは、それ以外の名前の DB を空にしない（tests/_support/db.ts）
  db-test:
    build: ../docker/db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app_test
      APP_DB_PASSWORD: app
    tmpfs:
      - /var/lib/postgresql

volumes:
  claude-config:
  gh-config:
  db-data:
